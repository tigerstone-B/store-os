<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STORE OS · F&B STORE DIAGNOSIS SYSTEM</title>

<style>
/* =========================================================
   STORE OS — F&B STORE DIAGNOSIS SYSTEM
   Standalone build: no server required.
   Design direction: Clean / Minimal / Professional (Data Terminal)
   ========================================================= */

@font-face { font-family: 'Pretendard'; src: local('Pretendard'); }

:root {
  --bg: #F5F5F3;
  --panel: #FFFFFF;
  --text-primary: #161616;
  --text-secondary: #777777;
  --border: #E5E5E5;
  --accent: #1F2A24;
  --positive: #2E7D32;
  --warning: #E07A1F;
  --negative: #C62828;
  --radius: 2px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text-primary);
  font-family: 'Pretendard', Arial, sans-serif; font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

button, input { font-family: inherit; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.brand-block { display: flex; flex-direction: column; line-height: 1.2; }
.brand-title { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
.brand-sub { font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.5px; margin-top: 2px; }

.search-block {
  display: flex; align-items: center; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; width: 380px;
}
.search-input {
  flex: 1; border: none; outline: none; padding: 10px 12px;
  font-size: 13px; color: var(--text-primary); background: var(--panel);
}
.search-input::placeholder { color: var(--text-secondary); }
.search-input:disabled { background: #F0F0EE; color: var(--text-secondary); }
.search-btn {
  border: none; background: var(--accent); color: #FFFFFF;
  font-size: 12px; font-weight: 600; letter-spacing: 0.5px; padding: 10px 18px; cursor: pointer;
}
.search-btn:hover { background: #14201A; }
.search-btn:disabled { background: #999999; cursor: default; }

.status-line {
  padding: 8px 28px; font-size: 12px; font-weight: 500;
  color: var(--text-secondary); background: #FFFFFF; border-bottom: 1px solid var(--border);
}
.status-line.error { color: var(--negative); }

.app-main { padding: 24px 28px; max-width: 1920px; margin: 0 auto; }

/* Setup gate: asks for the NAVER Maps Client ID before anything else loads */
.setup-gate {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; text-align: center; gap: 14px;
}
.setup-title { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
.setup-desc { font-size: 13px; color: var(--text-secondary); max-width: 460px; line-height: 1.6; }
.setup-form { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; width: 420px; }
.setup-input { flex: 1; border: none; outline: none; padding: 10px 12px; font-size: 13px; }
.setup-btn { border: none; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 10px 18px; cursor: pointer; }
.setup-btn:hover { background: #14201A; }
.setup-note { font-size: 11px; color: var(--text-secondary); max-width: 460px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; text-align: center;
}
.empty-title { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
.empty-desc { margin-top: 10px; font-size: 13px; color: var(--text-secondary); }

.panel-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px;
}

.store-info-bar {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px;
}
.store-name-block { display: flex; align-items: baseline; gap: 12px; }
.store-name { font-size: 18px; font-weight: 700; }
.store-address { font-size: 13px; color: var(--text-secondary); }

.split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.panel-body { width: 100%; height: 520px; background: #EFEFEC; border: 1px solid var(--border); position: relative; }
.panorama-empty { margin-top: 10px; font-size: 12px; color: var(--text-secondary); text-align: center; }

@media (max-width: 1200px) {
  .split-view { grid-template-columns: 1fr; }
  .search-block, .setup-form { width: 260px; }
}
</style>
</head>
<body>

  <header class="app-header">
    <div class="brand-block">
      <div class="brand-title">STORE OS</div>
      <div class="brand-sub">F&amp;B STORE DIAGNOSIS SYSTEM</div>
    </div>

    <form class="search-block" id="searchForm" autocomplete="off" hidden>
      <input type="text" id="searchInput" class="search-input" placeholder="주소 검색 (예: 서울 강남구 논현동 ...)" />
      <button type="submit" class="search-btn" id="searchBtn">SEARCH</button>
    </form>
  </header>

  <div class="status-line" id="statusLine" hidden></div>

  <main class="app-main">

    <!-- SETUP GATE: NAVER Maps Client ID 입력 (최초 1회) -->
    <section class="setup-gate" id="setupGate">
      <div class="setup-title">지도 API 연결</div>
      <div class="setup-desc">
        NAVER Cloud Platform에서 발급받은 <strong>Maps (Web Dynamic Map) Client ID</strong>를 입력하세요.
        이 값은 서버에 저장되지 않고, 이 브라우저 세션에서만 사용됩니다.
      </div>
      <form class="setup-form" id="setupForm" autocomplete="off">
        <input type="text" id="clientIdInput" class="setup-input" placeholder="NAVER Maps Client ID" />
        <button type="submit" class="setup-btn">CONNECT</button>
      </form>
      <div class="setup-note">
        NCP 콘솔의 Maps 서비스 &gt; Web 서비스 URL에 현재 페이지가 열린 도메인이 등록되어 있어야 지도가 로드됩니다.
      </div>
    </section>

    <!-- EMPTY STATE -->
    <section class="empty-state" id="emptyState" hidden>
      <div class="empty-title">STORE OS</div>
      <div class="empty-desc">매장을 검색해 진단을 시작하세요.</div>
    </section>

    <!-- STORE INFO + MAP/PANORAMA -->
    <section class="store-view" id="storeView" hidden>
      <div class="store-info-bar">
        <div class="store-name-block">
          <span class="store-name" id="storeName">-</span>
          <span class="store-address" id="storeAddress">-</span>
        </div>
      </div>

      <div class="split-view">
        <div class="split-panel">
          <div class="panel-label">MAP</div>
          <div id="map" class="panel-body"></div>
        </div>
        <div class="split-panel">
          <div class="panel-label">STREET VIEW</div>
          <div id="panorama" class="panel-body"></div>
          <div class="panorama-empty" id="panoramaEmpty" hidden>
            이 위치 주변에서 거리뷰를 찾을 수 없습니다.
          </div>
        </div>
      </div>
    </section>

  </main>

<script>
/**
 * STORE OS — Standalone build (no backend)
 *
 * WHY THIS VERSION IS DIFFERENT FROM THE SERVER-BACKED ONE:
 * NAVER Local Search (매장명 검색, 후보 리스트) requires a Client Secret.
 * A secret cannot be safely called from pure client-side code (it would be
 * exposed in the page source, and Naver's Local Search endpoint blocks
 * direct browser/CORS requests regardless). So this file intentionally
 * does NOT include that call.
 *
 * What IS kept, fully working client-side, with no server:
 *   - NAVER Maps JS SDK (지도 + 마커)      -> Client ID is not a secret
 *     (it's a domain-restricted public identifier; the SDK requires it
 *      directly in a <script> tag even in the server-backed version).
 *   - NAVER Geocoder (주소 -> 좌표)         -> part of the Maps JS SDK,
 *     no secret required.
 *   - NAVER Panorama (거리뷰)               -> part of the Maps JS SDK.
 *
 * Search behavior in this build: type an address (or a well-known place
 * name Naver's geocoder can resolve) and press SEARCH. This replaces the
 * "매장명 검색 -> 후보 리스트" flow from the server-backed MVP1.
 * If store-name search with multiple candidates is needed again, that
 * requires bringing back the Express backend from the previous version
 * (server/server.js + server/naver.js) to protect the Search API secret.
 */

const STORE_OS = {
  mapClientId: null,
  currentStore: null,
  mapInstance: null,
  panoramaInstance: null,
  defaultZoom: 17,
};

const els = {};

function cacheEls() {
  els.setupGate = document.getElementById('setupGate');
  els.setupForm = document.getElementById('setupForm');
  els.clientIdInput = document.getElementById('clientIdInput');
  els.searchForm = document.getElementById('searchForm');
  els.searchInput = document.getElementById('searchInput');
  els.searchBtn = document.getElementById('searchBtn');
  els.statusLine = document.getElementById('statusLine');
  els.emptyState = document.getElementById('emptyState');
  els.storeView = document.getElementById('storeView');
  els.storeName = document.getElementById('storeName');
  els.storeAddress = document.getElementById('storeAddress');
}

function setStatus(message, isError) {
  if (!message) {
    els.statusLine.hidden = true;
    els.statusLine.textContent = '';
    els.statusLine.classList.remove('error');
    return;
  }
  els.statusLine.hidden = false;
  els.statusLine.textContent = message;
  els.statusLine.classList.toggle('error', !!isError);
}

function setSearching(isSearching) {
  els.searchBtn.disabled = isSearching;
  els.searchBtn.textContent = isSearching ? '...' : 'SEARCH';
}

/* ---------- STEP 0: Client ID setup (replaces /api/map-config) ---------- */

function handleSetupSubmit(e) {
  e.preventDefault();
  const clientId = els.clientIdInput.value.trim();
  if (!clientId) return;

  STORE_OS.mapClientId = clientId;
  setStatus('지도 API를 불러오는 중입니다...', false);

  loadNaverMapsSdk(clientId)
    .then(() => {
      els.setupGate.hidden = true;
      els.searchForm.hidden = false;
      els.emptyState.hidden = false;
      initMap();
      initPanorama();
      setStatus(null);
    })
    .catch(() => {
      setStatus('지도 API 연결에 실패했습니다. Client ID 또는 도메인 등록을 확인해주세요.', true);
    });
}

function loadNaverMapsSdk(clientId) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src =
      'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' +
      encodeURIComponent(clientId) +
      '&submodules=panorama,geocoder';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('MAP_SDK_LOAD_ERROR'));
    document.head.appendChild(script);
  });
}

/* ---------- MAP ---------- */

let mapMarker = null;

function initMap() {
  const mapEl = document.getElementById('map');
  STORE_OS.mapInstance = new naver.maps.Map(mapEl, {
    center: new naver.maps.LatLng(37.5665, 126.9780),
    zoom: STORE_OS.defaultZoom,
    zoomControl: true,
    zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
  });
}

function placeStoreMarker(lat, lng, title) {
  if (!STORE_OS.mapInstance) return;
  const position = new naver.maps.LatLng(lat, lng);
  STORE_OS.mapInstance.setCenter(position);
  STORE_OS.mapInstance.setZoom(STORE_OS.defaultZoom);
  if (mapMarker) { mapMarker.setMap(null); mapMarker = null; }
  mapMarker = new naver.maps.Marker({ position: position, map: STORE_OS.mapInstance, title: title || '' });
}

/* ---------- PANORAMA ---------- */

function initPanorama() {
  STORE_OS.panoramaInstance = null;
}

function showStorePanorama(lat, lng) {
  const panoEl = document.getElementById('panorama');
  const emptyEl = document.getElementById('panoramaEmpty');
  emptyEl.hidden = true;
  panoEl.style.display = 'block';
  const position = new naver.maps.LatLng(lat, lng);

  try {
    if (STORE_OS.panoramaInstance) {
      STORE_OS.panoramaInstance.setPosition(position);
    } else {
      STORE_OS.panoramaInstance = new naver.maps.Panorama(panoEl, {
        position: position,
        pov: { pan: -135, tilt: 29, fov: 100 },
      });
    }
    naver.maps.Event.addListener(STORE_OS.panoramaInstance, 'pano_status', function (status) {
      if (status !== naver.maps.PanoramaStatus.OK) showNoPanorama();
    });
  } catch (err) {
    showNoPanorama();
  }
}

function showNoPanorama() {
  document.getElementById('panorama').style.display = 'none';
  document.getElementById('panoramaEmpty').hidden = false;
}

/* ---------- SEARCH (client-side geocoding, no backend) ---------- */

function showStoreView(name, address) {
  els.emptyState.hidden = true;
  els.storeView.hidden = false;
  els.storeName.textContent = name;
  els.storeAddress.textContent = address;
}

function handleSearchSubmit(e) {
  e.preventDefault();
  const query = els.searchInput.value.trim();
  if (!query) return;

  setStatus('SEARCHING STORE...', false);
  setSearching(true);

  naver.maps.Service.geocode({ query: query }, (status, response) => {
    setSearching(false);

    if (status !== naver.maps.Service.Status.OK) {
      setStatus('검색 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', true);
      return;
    }

    const result = response.v2.addresses && response.v2.addresses[0];

    if (!result) {
      setStatus('검색 결과가 없습니다. 주소를 다시 확인해주세요.', true);
      return;
    }

    const lat = parseFloat(result.y);
    const lng = parseFloat(result.x);
    const displayAddress = result.roadAddress || result.jibunAddress || query;

    STORE_OS.currentStore = { name: query, address: displayAddress, lat: lat, lng: lng };

    setStatus(null);
    showStoreView(query, displayAddress);
    placeStoreMarker(lat, lng, query);

    setStatus('LOADING STREET VIEW...', false);
    showStorePanorama(lat, lng);
    setStatus(null);
  });
}

/* ---------- INIT ---------- */

function init() {
  cacheEls();
  els.setupForm.addEventListener('submit', handleSetupSubmit);
  els.searchForm.addEventListener('submit', handleSearchSubmit);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
